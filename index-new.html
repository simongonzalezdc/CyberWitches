<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Witches: Idle Coven</title>
    <link rel="stylesheet" href="styles-new.css">
</head>
<body>
    <!-- HUD - Top Bar -->
    <div class="hud">
        <div class="hud-content">
            <div class="currency-display">
                <span id="ab-display">AB: 0</span>
                <span id="abps-display">0 AB/s</span>
            </div>
            <div class="hud-controls">
                <button id="auto-cast-toggle" class="btn-secondary">Auto: OFF</button>
                <button id="cast-button" class="btn-cast">✨ Cast</button>
            </div>
        </div>
    </div>

    <!-- Main Game Area -->
    <div class="main-game">
        <!-- Tab Navigation -->
        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="workstations">🏭 Workstations</button>
            <button class="tab-btn" data-tab="inscriptions">📜 Inscriptions</button>
            <button class="tab-btn" data-tab="inventory">🎒 Inventory</button>
            <button class="tab-btn" data-tab="experiment">🔬 Experiment</button>
            <button class="tab-btn" data-tab="dailies">📅 Dailies</button>
            <button class="tab-btn" data-tab="coven">🔮 Coven</button>
            <button class="tab-btn" data-tab="boons">⭐ Boons</button>
            <button class="tab-btn" data-tab="stats">📊 Stats</button>
        </div>

        <!-- Tab Content -->
        <div class="tabs-content">
            <!-- Workstations Tab -->
            <div id="workstations-tab" class="tab-panel active">
                <div id="workstation-list" class="content-list"></div>
            </div>

            <!-- Inscriptions Tab -->
            <div id="inscriptions-tab" class="tab-panel">
                <div id="upgrade-list" class="content-list"></div>
            </div>

            <!-- Inventory Tab -->
            <div id="inventory-tab" class="tab-panel">
                <div id="inventory-list" class="content-list"></div>
            </div>

            <!-- Experiment Tab -->
            <div id="experiment-tab" class="tab-panel">
                <button id="experiment-button" class="btn-primary">🔬 Try Experiment</button>
                <div id="experiment-result" class="result-box"></div>
                <div id="recipe-list" class="content-list"></div>
            </div>

            <!-- Dailies Tab -->
            <div id="dailies-tab" class="tab-panel">
                <div id="task-list" class="content-list"></div>
            </div>

            <!-- Coven Tab -->
            <div id="coven-tab" class="tab-panel">
                <div id="coven-content" class="content-list"></div>
            </div>

            <!-- Boons Tab -->
            <div id="boons-tab" class="tab-panel">
                <div class="boon-header">
                    <span id="ek-display">Eldritch Keys: 0</span>
                </div>
                <div id="boon-list" class="content-list"></div>
            </div>

            <!-- Stats Tab -->
            <div id="stats-tab" class="tab-panel">
                <div id="stats-content" class="content-list"></div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="prestige-modal" class="modal">
        <div class="modal-content">
            <h2>⚡ Ascend</h2>
            <p>Eldritch Keys: <span id="prestige-ek">0</span></p>
            <p>Next Ascend: +<span id="prestige-gain">0</span> EK</p>
            <div class="modal-buttons">
                <button id="ascend-button" class="btn-primary">Ascend</button>
                <button id="close-prestige-button" class="btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <div id="welcome-back-modal" class="modal">
        <div class="modal-content">
            <h2>🌙 Welcome Back!</h2>
            <p id="welcome-time">⏰ Away for: 0s</p>
            <p id="welcome-ab">✨ Earned: 0 AB</p>
            <button id="close-welcome-button" class="btn-primary">Close</button>
        </div>
    </div>

    <!-- Notifications Container -->
    <div id="notifications-container"></div>

    <!-- Scripts -->
    <script type="module" src="js/game.js"></script>
</body>
</html>
