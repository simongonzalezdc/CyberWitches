name: Deploy

# Manual-only until a real deploy target is configured. Previously this ran on
# every push to main and just echoed "Deployment would happen here", reporting a
# green "Deploy to Production" with no deploy actually occurring. Wire a real
# provider in the step below (GitHub Pages / Netlify / Vercel), then re-enable
# the push/tag triggers.
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  #   tags:
  #     - 'v*'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:prod
      - name: Deploy to hosting service
        run: |
          echo "::error::No deploy target configured. Wire GitHub Pages / Netlify /"
          echo "::error::Vercel here and re-enable the push triggers in this workflow."
          exit 1

