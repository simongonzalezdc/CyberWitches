<!DOCTYPE html>
<html>
<head>
    <title>Module Test</title>
</head>
<body>
    <div id="output">Loading modules...</div>
    
    <script type="module">
        try {
            import { formatShort } from './js/utils.js';
            import { formatShort as formatShortFromAnimations } from './js/animations.js';
            
            document.getElementById('output').innerHTML = `
                <p>utils.js formatShort: ${formatShort(1000)}</p>
                <p>animations.js formatShort: ${formatShortFromAnimations(1000)}</p>
            `;
        } catch (error) {
            document.getElementById('output').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            console.error('Module loading error:', error);
        }
    </script>
</body>
</html>
