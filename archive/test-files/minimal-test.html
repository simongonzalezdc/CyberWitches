<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Witches - Minimal Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 5px;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .warning { color: #ff9800; }
        .info { color: #2196F3; }
        button {
            padding: 10px 15px;
            margin: 5px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        #log {
            background-color: #000;
            padding: 10px;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Cyber Witches - Minimal Diagnostic Test</h1>
    
    <div class="test-section">
        <h2>Module Loading Test</h2>
        <div id="module-results"></div>
        <button onclick="testModuleLoading()">Test Module Loading</button>
    </div>
    
    <div class="test-section">
        <h2>Core System Test</h2>
        <div id="core-results"></div>
        <button onclick="testCoreSystems()">Test Core Systems</button>
    </div>
    
    <div class="test-section">
        <h2>Game State Test</h2>
        <div id="gamestate-results"></div>
        <button onclick="testGameState()">Test Game State</button>
    </div>
    
    <div class="test-section">
        <h2>DOM Elements Test</h2>
        <div id="dom-results"></div>
        <button onclick="testDOMElements()">Test DOM Elements</button>
    </div>
    
    <div class="test-section">
        <h2>Console Log</h2>
        <div id="log"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script type="module">
        // Global error handler
        window.addEventListener('error', (e) => {
            log(`ERROR: ${e.error.message} at ${e.filename}:${e.lineno}`, 'error');
        });
        
        window.addEventListener('unhandledrejection', (e) => {
            log(`PROMISE ERROR: ${e.reason}`, 'error');
        });
        
        // Logging function
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        window.log = log;
        window.clearLog = () => {
            document.getElementById('log').innerHTML = '';
        };
        
        // Test module loading
        window.testModuleLoading = async () => {
            const results = document.getElementById('module-results');
            results.innerHTML = '<p>Testing module imports...</p>';
            
            const modules = [
                'js/data.js',
                'js/utils.js',
                'js/errorHandler.js',
                'js/commonUtils.js',
                'js/animations.js',
                'js/virtualScroll.js',
                'js/covenSystem.js',
                'js/mobile.js',
                'js/accessibility.js',
                'js/cloudSave.js',
                'js/analytics.js',
                'js/particleEffects.js',
                'js/performanceMonitor.js',
                'js/gameState.js',
                'js/dailyRituals.js',
                'js/achievements.js',
                'js/comboSystem.js',
                'js/eventSystem.js',
                'js/game.js'
            ];
            
            let successCount = 0;
            let errorCount = 0;
            
            for (const module of modules) {
                try {
                    const mod = await import(module);
                    log(`✓ Successfully loaded ${module}`, 'success');
                    successCount++;
                } catch (error) {
                    log(`✗ Failed to load ${module}: ${error.message}`, 'error');
                    errorCount++;
                }
            }
            
            results.innerHTML = `
                <p class="success">Successfully loaded: ${successCount} modules</p>
                <p class="error">Failed to load: ${errorCount} modules</p>
            `;
        };
        
        // Test core systems
        window.testCoreSystems = async () => {
            const results = document.getElementById('core-results');
            results.innerHTML = '<p>Testing core systems...</p>';
            
            try {
                // Test data imports
                const { PRODUCERS, UPGRADES, PRESTIGE_BONUSES } = await import('./js/data.js');
                log(`✓ Data loaded: ${PRODUCERS.length} producers, ${UPGRADES.length} upgrades`, 'success');
                
                // Test utils
                const { formatShort, formatTimeDuration } = await import('./js/utils.js');
                const testFormat = formatShort(1234567);
                log(`✓ Utils working: formatShort(1234567) = ${testFormat}`, 'success');
                
                // Test error handler
                const { handleError } = await import('./js/errorHandler.js');
                log(`✓ Error handler loaded`, 'success');
                
                results.innerHTML = '<p class="success">Core systems test completed</p>';
            } catch (error) {
                log(`✗ Core systems test failed: ${error.message}`, 'error');
                results.innerHTML = `<p class="error">Core systems test failed: ${error.message}</p>`;
            }
        };
        
        // Test game state
        window.testGameState = async () => {
            const results = document.getElementById('gamestate-results');
            results.innerHTML = '<p>Testing game state...</p>';
            
            try {
                const { GameState } = await import('./js/gameState.js');
                const gameState = new GameState();
                
                log(`✓ GameState created`, 'success');
                log(`✓ Initial AB: ${gameState.ab}`, 'info');
                log(`✓ Initial inventory: ${JSON.stringify(gameState.inventory)}`, 'info');
                
                // Test basic operations
                gameState.addAb(100);
                log(`✓ After adding 100 AB: ${gameState.ab}`, 'success');
                
                gameState.cast();
                log(`✓ After cast: AB=${gameState.ab}, inventory=${JSON.stringify(gameState.inventory)}`, 'success');
                
                results.innerHTML = '<p class="success">Game state test completed</p>';
            } catch (error) {
                log(`✗ Game state test failed: ${error.message}`, 'error');
                results.innerHTML = `<p class="error">Game state test failed: ${error.message}</p>`;
            }
        };
        
        // Test DOM elements
        window.testDOMElements = () => {
            const results = document.getElementById('dom-results');
            results.innerHTML = '<p>Testing DOM elements...</p>';
            
            const requiredElements = [
                'ab-display',
                'abps-display',
                'cast-button',
                'workstation-list',
                'upgrade-list',
                'inventory-list'
            ];
            
            let foundCount = 0;
            let missingCount = 0;
            
            for (const elementId of requiredElements) {
                const element = document.getElementById(elementId);
                if (element) {
                    log(`✓ Found element: ${elementId}`, 'success');
                    foundCount++;
                } else {
                    log(`✗ Missing element: ${elementId}`, 'warning');
                    missingCount++;
                }
            }
            
            results.innerHTML = `
                <p class="success">Found: ${foundCount} elements</p>
                <p class="warning">Missing: ${missingCount} elements</p>
            `;
        };
        
        // Initial log message
        log('Minimal test page loaded successfully', 'success');
    </script>
</body>
</html>
