<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Witches Loading Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0E0E12;
            color: #FFFFFF;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #FF2DAA;
            border-radius: 8px;
        }
        .error {
            color: #FF2DAA;
            background: rgba(255, 45, 170, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .success {
            color: #3CE3C5;
            background: rgba(60, 227, 197, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .loading {
            color: #FFDB6E;
        }
        button {
            background: #FF2DAA;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        #console-output {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 5px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Cyber Witches Loading Diagnostic</h1>
    
    <div class="test-section">
        <h2>Module Loading Test</h2>
        <div id="module-test" class="loading">Testing module imports...</div>
    </div>
    
    <div class="test-section">
        <h2>Core Systems Test</h2>
        <div id="systems-test" class="loading">Testing core systems...</div>
    </div>
    
    <div class="test-section">
        <h2>DOM Elements Test</h2>
        <div id="dom-test" class="loading">Testing DOM elements...</div>
    </div>
    
    <div class="test-section">
        <h2>Console Output</h2>
        <div id="console-output"></div>
        <button onclick="clearConsole()">Clear Console</button>
    </div>
    
    <div class="test-section">
        <h2>Manual Tests</h2>
        <button onclick="testGameState()">Test GameState</button>
        <button onclick="testCovenSystem()">Test Coven System</button>
        <button onclick="testAnimations()">Test Animations</button>
        <button onclick="testVirtualScroll()">Test Virtual Scroll</button>
    </div>

    <script type="module">
        // Capture console errors
        const originalError = console.error;
        const originalLog = console.log;
        const consoleOutput = document.getElementById('console-output');
        
        function addToConsole(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.innerHTML = `<span style="color: #AAA;">[${timestamp}]</span> <span style="color: ${type === 'error' ? '#FF2DAA' : '#22E3FF'};">${message}</span>`;
            consoleOutput.appendChild(entry);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole(args.join(' '), 'error');
        };
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole(args.join(' '), 'log');
        };
        
        function clearConsole() {
            consoleOutput.innerHTML = '';
        }
        
        // Test module imports
        async function testModules() {
            const moduleTest = document.getElementById('module-test');
            const results = [];
            
            try {
                const { PRODUCERS, UPGRADES } = await import('./js/data.js');
                results.push('✓ data.js loaded');
            } catch (e) {
                results.push(`✗ data.js failed: ${e.message}`);
            }
            
            try {
                const { formatShort, formatTimeDuration } = await import('./js/utils.js');
                results.push('✓ utils.js loaded');
            } catch (e) {
                results.push(`✗ utils.js failed: ${e.message}`);
            }
            
            try {
                const { handleError } = await import('./js/errorHandler.js');
                results.push('✓ errorHandler.js loaded');
            } catch (e) {
                results.push(`✗ errorHandler.js failed: ${e.message}`);
            }
            
            try {
                const { GameState } = await import('./js/gameState.js');
                results.push('✓ gameState.js loaded');
            } catch (e) {
                results.push(`✗ gameState.js failed: ${e.message}`);
            }
            
            try {
                const { CovenSystem } = await import('./js/covenSystem.js');
                results.push('✓ covenSystem.js loaded');
            } catch (e) {
                results.push(`✗ covenSystem.js failed: ${e.message}`);
            }
            
            moduleTest.innerHTML = results.join('<br>');
            moduleTest.className = results.includes('✗') ? 'error' : 'success';
        }
        
        // Test core systems
        async function testCoreSystems() {
            const systemsTest = document.getElementById('systems-test');
            const results = [];
            
            try {
                const { GameState } = await import('./js/gameState.js');
                const gameState = new GameState();
                results.push('✓ GameState instantiated');
            } catch (e) {
                results.push(`✗ GameState failed: ${e.message}`);
            }
            
            try {
                const { CovenSystem } = await import('./js/covenSystem.js');
                const { GameState } = await import('./js/gameState.js');
                const gameState = new GameState();
                const covenSystem = new CovenSystem(gameState);
                results.push('✓ CovenSystem instantiated');
            } catch (e) {
                results.push(`✗ CovenSystem failed: ${e.message}`);
            }
            
            systemsTest.innerHTML = results.join('<br>');
            systemsTest.className = results.includes('✗') ? 'error' : 'success';
        }
        
        // Test DOM elements
        function testDOMElements() {
            const domTest = document.getElementById('dom-test');
            const results = [];
            
            // Check if main index.html elements exist
            fetch('./index.html')
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    const elements = [
                        'ab-display',
                        'cast-button',
                        'workstations-tab',
                        'inscriptions-tab',
                        'inventory-tab',
                        'experiment-tab',
                        'dailies-tab',
                        'coven-tab',
                        'boons-tab',
                        'stats-tab'
                    ];
                    
                    elements.forEach(id => {
                        const element = doc.getElementById(id);
                        if (element) {
                            results.push(`✓ ${id} found`);
                        } else {
                            results.push(`✗ ${id} missing`);
                        }
                    });
                    
                    domTest.innerHTML = results.join('<br>');
                    domTest.className = results.includes('✗') ? 'error' : 'success';
                })
                .catch(e => {
                    domTest.innerHTML = `✗ Failed to load index.html: ${e.message}`;
                    domTest.className = 'error';
                });
        }
        
        // Manual test functions
        window.testGameState = async function() {
            try {
                const { GameState } = await import('./js/gameState.js');
                const gameState = new GameState();
                gameState.start();
                addToConsole('GameState initialized successfully');
            } catch (e) {
                addToConsole(`GameState test failed: ${e.message}`, 'error');
            }
        };
        
        window.testCovenSystem = async function() {
            try {
                const { CovenSystem } = await import('./js/covenSystem.js');
                const { GameState } = await import('./js/gameState.js');
                const gameState = new GameState();
                const covenSystem = new CovenSystem(gameState);
                addToConsole('CovenSystem initialized successfully');
            } catch (e) {
                addToConsole(`CovenSystem test failed: ${e.message}`, 'error');
            }
        };
        
        window.testAnimations = async function() {
            try {
                const { createParticle, pulseElement } = await import('./js/animations.js');
                addToConsole('Animation functions loaded successfully');
            } catch (e) {
                addToConsole(`Animations test failed: ${e.message}`, 'error');
            }
        };
        
        window.testVirtualScroll = async function() {
            try {
                const { VirtualWorkstationList } = await import('./js/virtualScroll.js');
                addToConsole('Virtual scroll classes loaded successfully');
            } catch (e) {
                addToConsole(`Virtual scroll test failed: ${e.message}`, 'error');
            }
        };
        
        // Run all tests
        testModules();
        testCoreSystems();
        testDOMElements();
        
        addToConsole('Diagnostic page loaded successfully');
    </script>
</body>
</html>
