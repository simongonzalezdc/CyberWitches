<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <meta name="description" content="Cyber Witches: Idle Coven - A magical idle game about casting spells and building workstations">
    <meta name="theme-color" content="#0E0E12">
    <title>Cyber Witches: Idle Coven</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- HUD -->
    <div class="hud" role="banner" aria-label="Game Header">
        <div class="top-bar">
            <div class="currency" role="status" aria-live="polite" aria-atomic="true">
                <span id="ab-display" aria-label="Arcane Bits balance">AB: 0</span>
                <span id="abps-display" aria-label="Arcane Bits per second">0 AB/s</span>
            </div>
            <div class="top-bar-right" role="toolbar" aria-label="Game Controls">
                <button id="cast-button" class="cast-button"
                        aria-label="Cast spell to generate resources">✨ Cast</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container" id="main-content" role="main">
        <!-- Tab Navigation -->
        <nav class="tabs" role="tablist" aria-label="Game Sections">
            <button class="tab-button active" data-tab="workstations"
                    role="tab" aria-selected="true" aria-controls="workstations-tab"
                    tabindex="0">🏭 Workstations</button>
            <button class="tab-button" data-tab="inscriptions"
                    role="tab" aria-selected="false" aria-controls="inscriptions-tab"
                    tabindex="-1">📜 Inscriptions</button>
            <button class="tab-button" data-tab="inventory"
                    role="tab" aria-selected="false" aria-controls="inventory-tab"
                    tabindex="-1">🎒 Inventory</button>
        </nav>

        <!-- Tab Content -->
        <div class="tab-content">
            <!-- Workstations Tab -->
            <div id="workstations-tab" class="tab-pane active"
                 role="tabpanel" aria-labelledby="workstations-tab" tabindex="0">
                <div class="scroll-container" id="workstation-list"
                     role="region" aria-label="Workstations List"></div>
            </div>

            <!-- Inscriptions Tab -->
            <div id="inscriptions-tab" class="tab-pane"
                 role="tabpanel" aria-labelledby="inscriptions-tab" tabindex="0">
                <div class="scroll-container" id="upgrade-list"
                     role="region" aria-label="Inscriptions List"></div>
            </div>

            <!-- Inventory Tab -->
            <div id="inventory-tab" class="tab-pane"
                 role="tabpanel" aria-labelledby="inventory-tab" tabindex="0">
                <div class="scroll-container" id="inventory-list"
                     role="region" aria-label="Inventory Items"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Core Dependencies - Load in specific order to avoid dependency issues -->
    <script type="module">
        // Global error handler
        window.addEventListener('error', (e) => {
            console.error('Global error:', e.error);
            document.body.innerHTML += `<div style="background: red; color: white; padding: 10px;">Error: ${e.error.message}</div>`;
        });
        
        window.addEventListener('unhandledrejection', (e) => {
            console.error('Unhandled promise rejection:', e.reason);
            document.body.innerHTML += `<div style="background: red; color: white; padding: 10px;">Promise Error: ${e.reason}</div>`;
        });
    </script>
    
    <!-- Load core modules first -->
    <script type="module" src="js/data.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/errorHandler.js"></script>
    
    <!-- Game Systems -->
    <script type="module" src="js/gameState.js"></script>
    
    <!-- Main Game -->
    <script type="module">
        // Import only what we need for minimal functionality
        import { PRODUCERS, UPGRADES } from './js/data.js';
        import { formatShort } from './js/utils.js';
        import { GameState } from './js/gameState.js';
        import { handleError } from './js/errorHandler.js';

        // Global game state
        let gameState;
        let abDisplay;
        let abpsDisplay;
        let castButton;
        let tabButtons;
        let tabPanes;

        // Simple notification system
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'error' ? '#ff4444' : '#44ff44'};
                color: white;
                padding: 10px;
                border-radius: 5px;
                z-index: 10000;
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Initialize game
        function initGame() {
            try {
                console.log('Initializing game...');
                
                // Get UI elements
                abDisplay = document.getElementById('ab-display');
                abpsDisplay = document.getElementById('abps-display');
                castButton = document.getElementById('cast-button');
                tabButtons = document.querySelectorAll('.tab-button');
                tabPanes = document.querySelectorAll('.tab-pane');
                
                // Initialize game state
                gameState = new GameState();
                
                // Set up callbacks
                gameState.onAbChanged = (newValue) => {
                    if (abDisplay) {
                        abDisplay.textContent = `AB: ${formatShort(newValue)}`;
                    }
                };
                
                // Start game
                gameState.start();
                
                // Set up cast button
                if (castButton) {
                    castButton.addEventListener('click', () => {
                        gameState.cast();
                        updateWorkstationsTab();
                        updateInventoryTab();
                    });
                }
                
                // Set up tab switching
                tabButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        const tabName = button.dataset.tab;
                        switchTab(tabName);
                    });
                });
                
                // Update UI
                updateAllUI();
                
                // Update ABPS every second
                setInterval(() => {
                    if (abpsDisplay && gameState) {
                        const abps = gameState.getAbPerSecond();
                        abpsDisplay.textContent = `${abps.toFixed(1)} AB/s`;
                    }
                }, 1000);
                
                console.log('Game initialized successfully!');
                showNotification('Game loaded successfully!', 'success');
                
            } catch (error) {
                console.error('Error initializing game:', error);
                handleError(error, 'gameInitialization', true);
                showNotification(`Failed to initialize game: ${error.message}`, 'error');
            }
        }

        function switchTab(tabName) {
            if (!tabButtons || !tabPanes) return;
            
            // Update buttons
            tabButtons.forEach(btn => {
                const isActive = btn.dataset.tab === tabName;
                btn.classList.toggle('active', isActive);
            });
            
            // Update panes
            tabPanes.forEach(pane => {
                const isActive = pane.id === `${tabName}-tab`;
                pane.classList.toggle('active', isActive);
            });
            
            // Update tab content
            switch(tabName) {
                case 'workstations':
                    updateWorkstationsTab();
                    break;
                case 'inscriptions':
                    updateInscriptionsTab();
                    break;
                case 'inventory':
                    updateInventoryTab();
                    break;
            }
        }

        function updateWorkstationsTab() {
            if (!gameState) return;
            
            const container = document.getElementById('workstation-list');
            if (!container) return;
            
            container.innerHTML = '';
            
            // Show only unlocked workstations
            const unlockedWorkstations = PRODUCERS.filter(prod => gameState.ab >= prod.unlockAtAb);
            
            for (const prodData of unlockedWorkstations) {
                const owned = gameState.workstations[prodData.id] || 0;
                const recipe = gameState.constructor.prototype.scaledRecipe ? 
                    gameState.constructor.prototype.scaledRecipe(prodData.recipe, owned, prodData.growth) :
                    prodData.recipe;
                
                const canAfford = gameState.canAfford(recipe);
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">${prodData.displayName}</div>
                    <div class="card-description">⚙️ Owned: ${owned}</div>
                    <div class="card-section">
                        <div class="card-label">Produces:</div>
                        ${Object.entries(prodData.outputs).map(([id, rate]) =>
                            `<div class="card-value">${rate.toFixed(2)}/s ${id}</div>`
                        ).join('')}
                    </div>
                    <div class="card-section">
                        <div class="card-label">Recipe:</div>
                        ${Object.entries(recipe).map(([ingId, amount]) =>
                            `<div class="recipe-item ${canAfford ? 'can-afford' : 'cannot-afford'}">
                                ${ingId}: ${formatShort((gameState.inventory[ingId] || 0))} / ${formatShort(amount)}
                            </div>`
                        ).join('')}
                    </div>
                    <button class="primary-button" ${!canAfford ? 'disabled' : ''} 
                            onclick="craftWorkstation('${prodData.id}')">
                        Craft x1
                    </button>
                `;
                
                container.appendChild(card);
            }
        }

        function updateInscriptionsTab() {
            if (!gameState) return;
            
            const container = document.getElementById('upgrade-list');
            if (!container) return;
            
            container.innerHTML = '';
            
            // Show only unlocked upgrades
            const unlockedUpgrades = UPGRADES.filter(upg => gameState.ab >= upg.unlockAtAb);
            
            for (const upgData of unlockedUpgrades) {
                const owned = gameState.upgradesOwned[upgData.id] || false;
                const canAfford = gameState.canAfford(upgData.recipe);
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">${upgData.displayName} ${owned ? '✓' : ''}</div>
                    <div class="card-description">${upgData.description}</div>
                    <div class="card-section">
                        <div class="card-label">Recipe:</div>
                        ${Object.entries(upgData.recipe).map(([ingId, amount]) =>
                            `<div class="recipe-item ${canAfford ? 'can-afford' : 'cannot-afford'}">
                                ${ingId}: ${formatShort((gameState.inventory[ingId] || 0))} / ${formatShort(amount)}
                            </div>`
                        ).join('')}
                    </div>
                    <button class="primary-button" ${owned || !canAfford ? 'disabled' : ''} 
                            onclick="inscribeUpgrade('${upgData.id}')">
                        ${owned ? 'Owned' : 'Inscribe'}
                    </button>
                `;
                
                container.appendChild(card);
            }
        }

        function updateInventoryTab() {
            if (!gameState) return;
            
            const container = document.getElementById('inventory-list');
            if (!container) return;
            
            container.innerHTML = '';
            
            if (!gameState.inventory || Object.keys(gameState.inventory).length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'card';
                emptyMsg.innerHTML = '<div class="card-value">No ingredients yet. Cast to gather ingredients!</div>';
                container.appendChild(emptyMsg);
                return;
            }
            
            for (const ingId in gameState.inventory) {
                const amount = gameState.inventory[ingId];
                if (amount <= 0) continue;
                
                const item = document.createElement('div');
                item.className = 'card';
                item.innerHTML = `
                    <div class="card-value">${ingId}: ${formatShort(amount)}</div>
                `;
                container.appendChild(item);
            }
        }

        function updateAllUI() {
            updateWorkstationsTab();
            updateInscriptionsTab();
            updateInventoryTab();
        }

        // Global functions for onclick handlers
        window.craftWorkstation = (wsId) => {
            if (!gameState) return;
            if (gameState.craftWorkstation(wsId, 1)) {
                showNotification(`Crafted ${PRODUCERS.find(p => p.id === wsId)?.displayName || wsId}!`, 'success');
                updateWorkstationsTab();
                updateInventoryTab();
            }
        };

        window.inscribeUpgrade = (upgId) => {
            if (!gameState) return;
            if (gameState.inscribeUpgrade(upgId)) {
                showNotification(`Inscribed ${UPGRADES.find(u => u.id === upgId)?.displayName || upgId}!`, 'success');
                updateInscriptionsTab();
                updateInventoryTab();
            }
        };

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGame);
        } else {
            initGame();
        }
    </script>
</body>
</html>
