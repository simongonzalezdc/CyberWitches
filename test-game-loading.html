<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Loading Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Game Loading Test</h1>
    <div id="test-results"></div>
    
    <script>
        const results = document.getElementById('test-results');
        
        function addResult(message, type) {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        addResult('Starting game loading test...', 'info');
        
        // Test 1: Check if basic DOM elements exist
        window.addEventListener('DOMContentLoaded', () => {
            addResult('DOM loaded successfully', 'success');
            
            // Test 2: Try to load core modules
            Promise.all([
                import('./js/data.js'),
                import('./js/utils.js'),
                import('./js/gameState.js'),
                import('./js/game.js')
            ]).then(modules => {
                addResult('Core modules loaded successfully', 'success');
                
                // Test 3: Check if GameState class exists
                const { GameState } = modules[2];
                if (typeof GameState === 'function') {
                    addResult('GameState class available', 'success');
                    
                    // Test 4: Try to create a game state instance
                    try {
                        const gameState = new GameState();
                        addResult('GameState instance created successfully', 'success');
                    } catch (error) {
                        addResult(`Error creating GameState: ${error.message}`, 'error');
                    }
                } else {
                    addResult('GameState class not found', 'error');
                }
            }).catch(error => {
                addResult(`Error loading modules: ${error.message}`, 'error');
            });
        });
        
        // Test 5: Check for any global errors
        window.addEventListener('error', (event) => {
            addResult(`Global error: ${event.error.message}`, 'error');
        });
        
        // Test 6: Check for any unhandled promise rejections
        window.addEventListener('unhandledrejection', (event) => {
            addResult(`Unhandled promise rejection: ${event.reason}`, 'error');
        });
    </script>
</body>
</html>
